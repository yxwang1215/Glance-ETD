# Dense-encoder variant: glance_etd.yaml without the glance encoder (dense ViT), same 10x vision-tower learning rate.
data:
  vqa20k_mixture: lt14k_spatial
  max_response_length: 256
actor_rollout_ref:
  model:
    vision_token_compressor:
      curriculum:
        total_optimizer_steps: 175
      selector: divprune
      divprune_seed: centroid
  actor:
    optim:
      total_training_steps: 175
      vision_lr: 2.0e-06
  rollout:
    n: 1
    response_length: 256
trainer:
  total_training_steps: 175
  max_actor_ckpt_to_keep: null
