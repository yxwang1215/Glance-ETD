# Glance-ETD MLLM (main model, seed 0). Overlay on learnable_merge/training/default.yaml of the patched LT-OPD code.
# On-policy self-distillation on LT-OPD-14K-spatial (1.5K spatial rows replace originals), DivPrune centroid selection
# at 5% for the student, 1 rollout per prompt, 256-token answers, 175 steps. Glance encoder: 2x2-pooled first pass,
# 25% of the coarse cells re-encoded at native resolution (chosen by max-min diversity during training), applied to
# images with >= 4096 patches. Vision-tower learning rate 2e-6 (10x the LT-OPD default).
data:
  vqa20k_mixture: lt14k_spatial
  max_response_length: 256
actor_rollout_ref:
  model:
    vision_token_compressor:
      curriculum:
        total_optimizer_steps: 175
      selector: divprune
      divprune_seed: centroid
      efficient_vit: {mode: glance, zoom_ratio: 0.25, min_patches: 4096, feature_distill_coef: 0.0}
  actor:
    optim:
      total_training_steps: 175
      vision_lr: 2.0e-06
  rollout:
    n: 1
    response_length: 256
trainer:
  total_training_steps: 175
  max_actor_ckpt_to_keep: null
